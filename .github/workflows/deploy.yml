name: deploy

on:
  pull_request:
    paths:
      - ".github/workflows/deploy.yml"
      - "404.html"
      - "Gemfile"
      - "Gemfile.lock"
      - "_config.yml"
      - "_layouts/**"
      - "_posts/**"
      - "about.md"
      - "assets/**"
      - "index.html"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy.yml"
      - "404.html"
      - "Gemfile"
      - "Gemfile.lock"
      - "_config.yml"
      - "_layouts/**"
      - "_posts/**"
      - "about.md"
      - "assets/**"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
